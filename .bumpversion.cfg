[bumpversion]
# The ONLY version literal of the Python package lives in pyproject.toml
# ([project] version). __init__.py derives __version__ from the installed
# distribution metadata at import time — there is no second literal to
# coordinate, so this config bumps exactly one file.
# NOTE: the C++ kernel ("1.8.2-SNAPSHOT" in Kernel/Kernel.cpp) and the
# Java plugin keep their own release lines — they version the reasoner
# core, not the Python bindings, and are intentionally NOT bumped here.
current_version = 1.9.1
parse = (?P<major>\d+)\.(?P<minor>\d+)\.(?P<patch>\d+)
serialize = {major}.{minor}.{patch}
commit = True
tag = True

[bumpversion:file:pyproject.toml]
search = version = "{current_version}"
replace = version = "{new_version}"